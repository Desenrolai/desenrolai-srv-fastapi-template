name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Push novo na mesma ref cancela a execução anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default mínimo; o job que publica imagem eleva o próprio escopo.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: desenrolai/${{ github.event.repository.name }}
  PYTHON_VERSION: "3.13"

jobs:
  quality:
    name: Lint / Format / Typecheck / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check src tests

      - name: Format check
        run: uv run ruff format --check src tests

      - name: Typecheck
        run: uv run mypy

      - name: Test
        run: uv run pytest

  docker:
    name: Docker build${{ github.ref_name == github.event.repository.default_branch && ' + push' || '' }}
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Em PR/branch a imagem é só construída (gate); só a default branch publica.
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.repository.default_branch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
